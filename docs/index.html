<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4WON'S ENGLISH</title>
<meta name="description" content="하루 한 챕터 필수 영단어와 하루 한 표현 말하기 연습">
<meta name="theme-color" content="#f6f5f0">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="4WON'S ENGLISH">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Outfit:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="auth" id="auth" hidden>
  <form class="auth-card" id="authForm" novalidate>
    <img src="icons/icon-192.png" alt="" width="56" height="56">
    <h1>4WON'S ENGLISH</h1>
    <p>4WON'S PLANNER 계정으로 로그인하면 PC와 휴대폰에서 같은 진도로 이어서 공부합니다.</p>
    <div class="field">
      <label for="a-email">이메일</label>
      <input type="email" id="a-email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="a-pw">비밀번호</label>
      <input type="password" id="a-pw" autocomplete="current-password" required>
    </div>
    <div class="auth-msg" id="authMsg" role="status"></div>
    <button type="submit" class="btn primary block" id="authLogin">로그인</button>
  </form>
</section>

<div class="shell" id="main" hidden>
  <header class="topbar">
    <a class="brand" href="#home"><img src="icons/icon-192.png" alt="" width="28" height="28"><b>4WON'S ENGLISH</b></a>
    <nav class="tabs" aria-label="화면">
      <button type="button" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V19h12V9.5"/></svg><span>홈</span></button>
      <button type="button" data-tab="words"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="13" height="16" rx="2"/><path d="M8 9h5M8 13h3"/><path d="M17 7.5l3 1v11l-9 1"/></svg><span>단어</span></button>
      <button type="button" data-tab="speak"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span>말하기</span></button>
      <button type="button" data-tab="wrong"><svg viewBox="0 0 24 24"><path d="M6 3.5h9l3 3V20.5H6z"/><path d="M9.5 10.5l5 5M14.5 10.5l-5 5"/></svg><span>오답 노트</span></button>
    </nav>
    <div class="top-tools">
      <span class="sync-dot" id="syncDot"></span>
      <button type="button" class="icon-btn" id="settingsBtn" aria-label="설정" title="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2L5.5 5.5"/></svg></button>
    </div>
  </header>
  <main class="view" id="view"></main>
</div>

<dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
  <div class="sheet-head"><h2 id="settingsTitle">설정</h2><button type="button" class="icon-btn" id="settingsClose" aria-label="닫기">×</button></div>
  <div id="settingsBody"></div>
</dialog>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
